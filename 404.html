<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Yomna Afify & Ahmed — You're Invited</title>
  <meta name="description" content="You're invited to the wedding of Yomna Afify & Ahmed. Thursday 17 September 2026 at 8:00 PM, Beau Jardin, Sheikh Zayed." />
  <meta name="theme-color" content="#6B1D28" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Yomna & Ahmed" />
  <meta property="og:title" content="Yomna Afify & Ahmed — Wedding Invitation" />
  <meta property="og:description" content="Two souls. One beautiful chaos. 17 September 2026 · 8:00 PM · Beau Jardin" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aliamin565.github.io/yomna-and-ahmed/" />
  <meta property="og:image" content="https://aliamin565.github.io/yomna-and-ahmed/assets/og-share.jpg" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%236B1D28'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='18' fill='%23F4EAD8' font-family='Georgia'%3EY%26amp;A%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="assets/og-share.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="velvet">
    <div class="stage" id="stage">
      <div class="grain" aria-hidden="true"></div>

      <section class="cover" id="cover">
        <div class="cover-wash burgundy"></div>
        <div class="cover-wash olive"></div>
        <img class="cover-lilies" src="assets/lilies.jpg" alt="" />
        <p class="kicker">You're invited to the wedding of</p>
        <p class="kicker ar" dir="rtl">أنتم مدعوون إلى حفل زفاف</p>
        <h1 class="names">
          <span class="name burgundy-text">Yomna</span>
          <span class="amp">&amp;</span>
          <span class="name olive-text">Ahmed</span>
        </h1>
        <p class="cover-date">17 · 09 · 26</p>
        <button class="seal-btn" id="openBtn" type="button" aria-label="Open the invitation">
          <img src="assets/wax-seal.jpg" alt="" />
          <span>Tap to open · اضغط للفتح</span>
        </button>
        <p class="cover-hint">Two souls. One beautiful chaos.</p>
      </section>

      <div class="curtains" id="curtains" aria-hidden="true">
        <div class="curtain left"></div>
        <div class="curtain right"></div>
      </div>

      <section class="film" id="film" aria-hidden="true">
        <button class="skip" id="skipBtn" type="button">Skip · تخطي</button>
        <p class="film-quote">Two souls. One beautiful chaos.</p>
        <p class="film-quote ar" dir="rtl">ومن كل فوضى خلقنا… حكايتنا.</p>
        <img class="film-lilies" src="assets/lilies.jpg" alt="" />
        <figure class="polaroid">
          <img src="assets/invitation.png" alt="Yomna Afify and Ahmed wedding invitation" />
        </figure>
        <img class="film-stamp" src="assets/stamp.jpg" alt="" />
        <div class="film-names">
          <span>Yomna</span>
          <i>&amp;</i>
          <span>Ahmed</span>
        </div>
        <p class="film-when">17 September 2026 · 8:00 PM</p>
        <p class="film-where">Beau Jardin · Sheikh Zayed</p>
      </section>

      <button class="music-btn" id="musicBtn" type="button" aria-label="Play music" aria-pressed="false">
        <span class="music-icon" aria-hidden="true">♪</span>
      </button>
      <audio id="bgm" src="assets/music.mp3" loop preload="auto" playsinline></audio>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
